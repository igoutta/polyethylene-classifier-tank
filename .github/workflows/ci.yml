name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Sin extras: el hardware se simula con los pines mock de gpiozero
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run ty check
      - name: Complejidad cognitiva
        run: uv run complexipy -q
      - name: Pruebas
        run: uv run pytest
