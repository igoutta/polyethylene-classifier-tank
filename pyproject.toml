[project]
name = "polyethylene-classifier-tank"
version = "0.1.0"
description = "Control del tanque clasificador de polietileno (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "gpiozero>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Solo en la Raspberry Pi (backend de GPIO)
pi = ["lgpio>=0.2"]
# Servicio aparte de la balanza (polyethylene_tank.scale)
scale = [
    "RPLCD==1.3.1",
    "smbus2==0.4.3",
]

[project.scripts]
tank-server = "polyethylene_tank.__main__:main"
tank-scale = "polyethylene_tank.scale:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyethylene_tank"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplificaciones
    "C90",     # complejidad ciclomática (ver max-complexity)
    "PL",      # pylint: demasiadas ramas/sentencias/argumentos
    "RUF",
]

[tool.ruff.lint.mccabe]
# Ruff no tiene "complejidad cognitiva"; la ciclomática baja es lo más cercano
max-complexity = 6

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 25
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # números mágicos en asserts
"tools/*" = ["PLR2004"]  # scripts de banco con tiempos fijos

[tool.ty.environment]
python-version = "3.11"
