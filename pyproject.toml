[project]
name = "polyethylene-classifier-tank"
version = "0.1.0"
description = "Control del tanque clasificador de polietileno (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "gpiozero>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Solo en la Raspberry Pi (backend de GPIO)
pi = ["lgpio>=0.2"]
# Servicio aparte de la balanza (scale.py)
scale = [
    "hx711-rpi-py==1.65.0",
    "RPLCD==1.3.1",
    "smbus2==0.4.3",
]

[tool.uv]
package = false
